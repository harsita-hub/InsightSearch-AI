<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Follow-up Answer - InsightSearch AI</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="follow-up-page">

        <div class="follow-up-card">

            <h1>💬 Follow-up Answer</h1>

            <div class="follow-up-answer">
                <h2>🤖 AI Answer</h2>

                <p>{{ answer }}</p>
            </div>

            <div class="follow-up-box">

                <h2>💬 Ask another question</h2>

                <form action="/follow-up" method="POST">

                    <input
                        type="text"
                        name="question"
                        placeholder="Ask another question..."
                        required
                    >

                    <button type="submit">Ask</button>

                </form>

            </div>

            <a href="/">← Back to Search</a>

        </div>

    </div>

</body>

</html>
